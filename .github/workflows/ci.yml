name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Valores ficticios: los clientes se crean al importar, pero ningun test
      # llama a las APIs. Los tests live siguen saltados por sus propios gates.
      ANTHROPIC_API_KEY: test
      OPENAI_API_KEY: test
      DATABASE_URL: postgresql://test:test@localhost/test
      MEETING_DATABASE_URL: postgresql://test:test@localhost/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest
