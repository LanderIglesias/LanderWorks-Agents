repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff          # linting — detecta errores reales
        args: [--fix]
                          # ruff-format comentado — lo hace black

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black         # formateo — único responsable

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks      # secretos — crítico

  - repo: local
    hooks:
      # Solo los tests afectados por lo staged (la suite completa tarda ~25 min);
      # la CI ejecuta la suite entera en cada PR.
      - id: pytest
        name: pytest (tests afectados)
        entry: python scripts/pytest_changed.py
        language: system
        pass_filenames: true