<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>Gastos</title>
  <meta name="theme-color" content="#fdfcff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0a0a0f" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gastos" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
<!--
THESIS: Liquid Glass replaces the flat-card iOS-lite look with real translucent
material — Control Center/Wallet-grade glass — refusing the safe "solid card
+ accent" default this category always ships.
OWN-WORLD: Violet-black-to-near-black gradient (light: white-to-lavender-gray)
behind heavy-blur glass on fixed chrome only; flat semi-transparent rows in
scrollable lists; coral primary accent, amber warning accent, drawn from the
existing Gastos identity.
STORY: Total and spend read instantly through glass that feels expensive, not
decorative; a warning-amber sheet always means "look here."
FIRST VIEWPORT: Navbar glass + segmented control + total-card glass over a
color halo, expense rows flat below.
FORM: Brief-pinned (iOS Liquid Glass / Control Center); concept-seed roll
skipped per new-work.md — a user/brief-pinned direction beats the roll.
FINISH: unreviewed and undocumented is unfinished; this build ends with the
finish review, the verdict, and DESIGN.md.
-->
  <svg xmlns="http://www.w3.org/2000/svg" style="display: none">
    <symbol id="icon-food" viewBox="0 0 24 24">
      <path d="M7 3v7a1 1 0 0 0 1 1h0a1 1 0 0 0 1-1V3" />
      <path d="M9 11v10" />
      <path d="M15 3c-1.1 0-2 1.34-2 3s.9 3 2 3 2-1.34 2-3-.9-3-2-3z" />
      <path d="M15 9v12" />
    </symbol>
    <symbol id="icon-transport" viewBox="0 0 24 24">
      <path d="M4 16V9a1 1 0 0 1 .8-1l1.7-2.2A2 2 0 0 1 8.1 5h7.8a2 2 0 0 1 1.6.8L19.2 8a1 1 0 0 1 .8 1v7" />
      <path d="M4 16h16" />
      <path d="M4 16v2a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-2" />
      <path d="M17 16v2a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-2" />
      <circle cx="7.5" cy="16" r="1.5" />
      <circle cx="16.5" cy="16" r="1.5" />
    </symbol>
    <symbol id="icon-repeat" viewBox="0 0 24 24">
      <path d="M4 12a8 8 0 0 1 14-5.2M20 4v4h-4" />
      <path d="M20 12a8 8 0 0 1-14 5.2M4 20v-4h4" />
    </symbol>
    <symbol id="icon-play" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9" />
      <path d="M10 9l5 3-5 3V9z" />
    </symbol>
    <symbol id="icon-cross" viewBox="0 0 24 24">
      <rect x="3.5" y="3.5" width="17" height="17" rx="5" />
      <path d="M12 8v8M8 12h8" />
    </symbol>
    <symbol id="icon-home" viewBox="0 0 24 24">
      <path d="M4 11.5 12 4l8 7.5" />
      <path d="M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9" />
      <path d="M10 20v-6h4v6" />
    </symbol>
    <symbol id="icon-box" viewBox="0 0 24 24">
      <path d="M3.5 8 12 4l8.5 4-8.5 4-8.5-4z" />
      <path d="M3.5 8v8L12 20l8.5-4V8" />
      <path d="M12 12v8" />
    </symbol>
    <symbol id="icon-list" viewBox="0 0 24 24">
      <path d="M8 6h12M8 12h12M8 18h12" />
      <path d="M4 6h.01M4 12h.01M4 18h.01" />
    </symbol>
    <symbol id="icon-alert" viewBox="0 0 24 24">
      <path d="M12 3.5 21 19H3L12 3.5z" />
      <path d="M12 10v4" />
      <path d="M12 16.5h.01" />
    </symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24">
      <path d="M12 5v14M5 12h14" />
    </symbol>
    <symbol id="icon-sun" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="4.5" />
      <path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6" />
    </symbol>
    <symbol id="icon-moon" viewBox="0 0 24 24">
      <path d="M20 14.2A8.5 8.5 0 1 1 9.8 4a7 7 0 0 0 10.2 10.2z" />
    </symbol>
  </svg>

  <div id="app">
    <!-- ── Clave de acceso (una sola vez, se guarda en localStorage) ───── -->
    <div class="sheet lock-screen" id="view-lock" hidden>
      <div class="sheet-body" style="padding-top: max(60px, env(safe-area-inset-top))">
        <p style="margin-bottom: 20px; color: var(--text-secondary); font-size: 14px">
          Introduce tu clave de acceso para ver tus gastos.
        </p>
        <div class="field-group">
          <div class="field-row">
            <span class="field-label">Clave</span>
            <input id="lock-token" type="password" placeholder="••••••••" autocomplete="off" />
          </div>
        </div>
        <button class="primary-button" id="lock-save">Entrar</button>
        <p id="lock-error" style="margin-top: 12px; color: var(--danger); font-size: 13px" hidden>
          Clave incorrecta.
        </p>
      </div>
    </div>

    <!-- ── Pantalla principal ─────────────────────────────────────────── -->
    <div id="view-main">
      <header class="navbar">
        <span class="navbar-title">Gastos</span>
        <button class="theme-toggle" id="theme-toggle" aria-label="Cambiar tema">
          <svg class="icon" id="theme-toggle-icon"><use href="#icon-moon" /></svg>
        </button>
      </header>

      <div class="list-scroll">
        <div class="segmented" id="granularity-switch">
          <div class="segmented-thumb" id="granularity-thumb"></div>
          <button data-granularity="day">Día</button>
          <button data-granularity="month" class="active">Mes</button>
          <button data-granularity="year">Año</button>
        </div>

        <div class="total-card" id="total-card">
          <div class="amount" id="total-amount">—</div>
          <div class="meta" id="total-meta">Cargando…</div>
        </div>

        <div class="quick-actions">
          <button class="quick-action primary" id="fab-add" aria-label="Añadir gasto manual">
            <span class="circle"><svg class="icon"><use href="#icon-plus" /></svg></span>
            <span class="label">Añadir</span>
          </button>
          <button class="quick-action" id="quick-review" aria-label="Ver revisión">
            <span class="circle">
              <svg class="icon"><use href="#icon-alert" /></svg>
              <span class="badge" id="quick-review-badge" hidden>0</span>
            </span>
            <span class="label">Revisión</span>
          </button>
        </div>

        <div id="expense-list"></div>
      </div>

      <nav class="tabbar">
        <button class="active" data-tab="main">
          <span class="tab-icon"><svg class="icon"><use href="#icon-list" /></svg></span>
          <span>Gastos</span>
        </button>
        <button data-tab="review" style="position: relative">
          <span class="tab-icon"><svg class="icon"><use href="#icon-alert" /></svg></span>
          <span>Revisión</span>
          <span class="review-badge" id="review-badge" hidden>0</span>
        </button>
      </nav>
    </div>

    <!-- ── Cola de revisión — tinte ámbar de fondo en el header ─────────── -->
    <div class="sheet sheet-review" id="view-review">
      <div class="sheet-header">
        <button class="back-button" data-close="review">Cerrar</button>
        <span class="navbar-title">Revisión</span>
      </div>
      <div class="sheet-body" id="review-list"></div>
    </div>

    <!-- ── Detalle de gasto — neutro; acento ámbar si needs_review ──────── -->
    <div class="sheet" id="view-detail">
      <div class="sheet-header">
        <button class="back-button" data-close="detail">Atrás</button>
        <span class="navbar-title" id="detail-title">Gasto</span>
      </div>
      <div class="sheet-body">
        <div class="field-group">
          <div class="field-row">
            <span class="field-label">Comercio</span>
            <input id="detail-merchant" type="text" placeholder="—" />
          </div>
          <div class="field-row">
            <span class="field-label">Importe (€)</span>
            <input id="detail-amount" type="number" step="0.01" placeholder="0.00" />
          </div>
          <div class="field-row">
            <span class="field-label">Categoría</span>
            <select id="detail-category">
              <option value="">—</option>
              <option value="comida">Comida</option>
              <option value="transporte">Transporte</option>
              <option value="suscripciones">Suscripciones</option>
              <option value="ocio">Ocio</option>
              <option value="salud">Salud</option>
              <option value="hogar">Hogar</option>
              <option value="otros">Otros</option>
            </select>
          </div>
        </div>

        <div class="field-group">
          <div class="field-row">
            <span class="field-label">Origen</span>
            <span id="detail-source" style="color: var(--text-secondary)"></span>
          </div>
          <div class="field-row">
            <span class="field-label">Fecha</span>
            <span id="detail-date" style="color: var(--text-secondary)"></span>
          </div>
          <div class="field-row" id="detail-review-row" hidden>
            <span class="field-label">Estado</span>
            <span class="review-badge-pill">Pendiente de revisión</span>
          </div>
        </div>

        <div class="field-group" id="detail-raw-group" hidden>
          <div class="raw-text-block" id="detail-raw-text"></div>
        </div>

        <button class="primary-button" id="detail-save">Guardar cambios</button>
      </div>
    </div>

    <!-- ── Alta manual — "esto es nuevo", header con acento coral ───────── -->
    <div class="sheet sheet-accent" id="view-add">
      <div class="sheet-header">
        <button class="back-button" data-close="add">Cancelar</button>
        <span class="navbar-title">Añadir gasto</span>
      </div>
      <div class="sheet-body">
        <div class="field-group">
          <div class="field-row">
            <span class="field-label">Comercio</span>
            <input id="add-merchant" type="text" placeholder="Ej. Mercadona" />
          </div>
          <div class="field-row">
            <span class="field-label">Importe (€)</span>
            <input id="add-amount" type="number" step="0.01" placeholder="0.00" inputmode="decimal" />
          </div>
          <div class="field-row">
            <span class="field-label">Categoría</span>
            <select id="add-category">
              <option value="">Auto (IA)</option>
              <option value="comida">Comida</option>
              <option value="transporte">Transporte</option>
              <option value="suscripciones">Suscripciones</option>
              <option value="ocio">Ocio</option>
              <option value="salud">Salud</option>
              <option value="hogar">Hogar</option>
              <option value="otros">Otros</option>
            </select>
          </div>
          <div class="field-row">
            <span class="field-label">Fecha</span>
            <input id="add-date" type="datetime-local" />
          </div>
        </div>
        <button class="primary-button" id="add-save">Guardar gasto</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
