[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
  ".venv",
  "backend/agents/dental_agent/data", "backend/agents/scaffold_web_agent/data",
  "backend/agents/dental_agent/data/leads.db",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query()/etc. in argument defaults is the documented,
# intended pattern (the call is evaluated once per request by FastAPI's
# dependency injection, not at function-definition time like a real mutable
# default) — not the bug B008 exists to catch. Without this, every agent's
# FastAPI endpoints using Depends() hit B008 the first time pre-commit runs
# against them, one file at a time, instead of being fixed once here.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File"]